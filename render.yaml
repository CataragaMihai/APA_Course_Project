# Render Blueprint: the backend (FastAPI) and the site (static) together.
# Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: apa-course-project-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

  - type: web
    name: apa-course-project
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # the backend's public URL; if Render gives the API a different address, change it here
      - key: VITE_API_BASE
        value: https://apa-course-project-api.onrender.com
